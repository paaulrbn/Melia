name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Create .env file
        shell: bash
        run: |
          cat > .env << ENVEOF
          MEDIA_SERVER_DISPLAY_NAME=${{ secrets.MEDIA_SERVER_DISPLAY_NAME }}
          MEDIA_SERVER_HOST=${{ secrets.MEDIA_SERVER_HOST }}
          MEDIA_SERVER_PORT=${{ secrets.MEDIA_SERVER_PORT }}
          MEDIA_SERVER_USERNAME=${{ secrets.MEDIA_SERVER_USERNAME }}
          MEDIA_SERVER_PASSWORD=${{ secrets.MEDIA_SERVER_PASSWORD }}
          MEDIA_SERVER_ROOT_PATH=${{ secrets.MEDIA_SERVER_ROOT_PATH }}
          RADARR_BASE_URL=${{ secrets.RADARR_BASE_URL }}
          RADARR_API_KEY=${{ secrets.RADARR_API_KEY }}
          RADARR_ROOT_FOLDER=${{ secrets.RADARR_ROOT_FOLDER }}
          SONARR_BASE_URL=${{ secrets.SONARR_BASE_URL }}
          SONARR_API_KEY=${{ secrets.SONARR_API_KEY }}
          ENVEOF

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Melia ${{ github.ref_name }}'
          releaseBody: |
            ## Téléchargement
            - **macOS** → `Melia_*.dmg`
            - **Windows** → `Melia_*_x64-setup.exe`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
